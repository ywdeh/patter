<!doctype html>
<html lang="en" class="bg-mauve-950 text-mauve-100 cursor-default selection:bg-mauve-100/12 font-[Google_Sans] patter_shadow_text
caret-mauve-100" spellcheck="false">

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<script>
			(() => {
				// Keep this early-paint path aligned with DEFAULT_BACKGROUND_SRC in background.svelte.js.
				const defaults = { focus: 10, tint: 50, grain: 2, background: '/backgrounds/green_facade.jpg' };
				let saved = {};
				let fallbackBackground = defaults.background;
				let backgroundPosition = 'center';
				try {
					saved = JSON.parse(localStorage.getItem('background-values') || '{}');
					const focus = Number(saved.focus);
					const tint = Number(saved.tint);
					const grain = Number(saved.grain);
					if (Number.isFinite(focus)) defaults.focus = Math.min(15, Math.max(5, focus));
					if (Number.isFinite(tint)) defaults.tint = Math.min(80, Math.max(20, tint));
					if (Number.isFinite(grain)) defaults.grain = Math.min(4, Math.max(0, grain));
					backgroundPosition = ['top', 'center', 'bottom'].includes(saved.position) ? saved.position : 'center';
					if (typeof saved.background === 'string' && /^\/backgrounds\/.+\.(?:avif|gif|jpe?g|png|webp)$/i.test(saved.background)) {
						defaults.background = saved.background;
						fallbackBackground = saved.background;
					}
					if (typeof saved.background === 'string' && (/^\/backgrounds\/.+\.(?:mp4|webm|ogv|ogg)$/i.test(saved.background) || saved.background.startsWith('upload:'))) {
						const posters = JSON.parse(localStorage.getItem('patter-video-posters') || '{}');
						const poster = posters[saved.background];
						if (typeof poster === 'string' && /^data:image\/(?:webp|jpeg|png);base64,/i.test(poster) && poster.length < 2500000) {
							fallbackBackground = poster;
						}
					}
				} catch {}
				const root = document.documentElement;
				root.style.setProperty('--patter-focus', `${defaults.focus}px`);
				root.style.setProperty('--patter-tint', `${defaults.tint / 100}`);
				root.style.setProperty('--patter-grain', `${defaults.grain / 100}`);
				root.style.setProperty('--patter-background-position', backgroundPosition);
				root.style.setProperty('--patter-background', `url("${fallbackBackground}")`);
			})();
		</script>
		<script>
			window.patterPrimeDocumentPreview = () => {
				try {
					const saved = JSON.parse(localStorage.getItem('patter-doc') || 'null');
					if (!saved || typeof saved !== 'object') return;

					const cssText = (value) => JSON.stringify(String(value ?? ''))
						.replace(/\\r\\n|\\n|\\r/g, '\\A ');
					const bodyHolder = document.createElement('div');
					bodyHolder.innerHTML = typeof saved.body === 'string' ? saved.body : '';
					bodyHolder.querySelectorAll('br').forEach((node) => node.replaceWith('\n'));
					bodyHolder.querySelectorAll('p, div').forEach((node) => node.append('\n'));

					const root = document.documentElement;
					root.style.setProperty('--patter-saved-title', cssText(saved.title));
					root.style.setProperty('--patter-saved-body', cssText(bodyHolder.textContent));
					root.classList.add('has-patter-doc');
				} catch {}
			};
			window.patterPrimeDocumentPreview();
		</script>

		<link rel="preload" href="/fonts/Amarante.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/fonts/Bitter.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/fonts/GoogleSans.woff2" as="font" type="font/woff2" crossorigin>

		<link rel="preload" href="/type.mp3" as="audio">

		%sveltekit.head%

		<title>Patter</title>

		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/Draggable.min.js"></script>
	</head>

	<body data-sveltekit-preload-data="hover" class="overflow-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>

</html>
