<!doctype html>
<html lang="en" class="patter_ambient_background patter_text_color cursor-default selection:bg-mauve-100/12 patter_font_ui patter_shadow_text
caret-mauve-100" spellcheck="false">

	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="description" content="Patter is an ambient writing editor that keeps everything else out of sight while you write." />
		<meta name="theme-color" content="#0b120f" />
		<meta name="color-scheme" content="dark" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Patter" />
		<meta property="og:title" content="Patter" />
		<meta property="og:description" content="An ambient writing editor that keeps everything else out of sight while you write." />
		<meta property="og:url" content="https://patter.hedwy.art/" />
		<meta property="og:image" content="https://patter.hedwy.art/patter-og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Patter, an ambient writing editor, shown over a softly blurred dark forest background." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Patter" />
		<meta name="twitter:description" content="An ambient writing editor that keeps everything else out of sight while you write." />
		<meta name="twitter:image" content="https://patter.hedwy.art/patter-og.jpg" />
		<script>
			window.patter_analytics_enabled = location.hostname === 'patter.hedwy.art';
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			if (window.patter_analytics_enabled) {
				gtag('set', { page_title: 'Patter', page_location: location.origin + location.pathname });
				gtag('js', new Date());
				gtag('config', 'G-2LFQ1HS7XW', { page_title: 'Patter' });
				const analytics = document.createElement('script');
				analytics.async = true;
				analytics.src = 'https://www.googletagmanager.com/gtag/js?id=G-2LFQ1HS7XW';
				document.head.append(analytics);
			}
		</script>

		<script>
			(() => {
				const defaults = { focus: 10, tint: 50, grain: 2, textSize: 18, background: '/backgrounds/book.webp' };
				const backgrounds = [];
				let saved = {};
				let fallbackBackground = defaults.background;
				let selectedBackground = defaults.background;
				let backgroundPosition = 'center';
				try {
					saved = JSON.parse(localStorage.getItem('background-values') || '{}');
					if (!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = {};
					for (const [key, min, max] of [['focus', 0, 15], ['tint', 0, 80], ['grain', 0, 4], ['textSize', 14, 24]]) {
						const value = saved[key];
						if (typeof value === 'number' && Number.isInteger(value) && value >= min && value <= max) defaults[key] = value;
					}
					const savedBackground = saved.background;
					backgroundPosition = ['top', 'center', 'bottom'].includes(saved.position) ? saved.position : 'center';
					if (backgrounds.some((item) => item.src === savedBackground && item.kind === 'image')) {
						defaults.background = savedBackground;
						selectedBackground = savedBackground;
						fallbackBackground = savedBackground;
					}
					if (typeof savedBackground === 'string' && (backgrounds.some((item) => item.src === savedBackground && item.kind === 'video') || /^upload:[a-z0-9-]+$/i.test(savedBackground))) {
						selectedBackground = savedBackground;
						const posters = JSON.parse(localStorage.getItem('patter-video-posters') || '{}');
						const poster = posters[savedBackground];
						if (typeof poster === 'string' && /^data:image\/(?:webp|jpeg|png);base64,/i.test(poster) && poster.length < 2500000) {
							fallbackBackground = poster;
						}
					}
				} catch {}
				const root = document.documentElement;
				let ambientColor = '#0b120f';
				let backgroundScrim = 0;
				try {
					const colors = JSON.parse(localStorage.getItem('patter-background-ambient-colors-v3') || '{}');
					const cachedColor = colors[selectedBackground];
					if (typeof cachedColor === 'string' && /^#[\da-f]{6}$/i.test(cachedColor)) ambientColor = cachedColor;
				} catch {}
				try {
					const scrims = JSON.parse(localStorage.getItem('patter-background-scrim-v1') || '{}');
					const cachedScrim = Number(scrims[selectedBackground]);
					if (Number.isFinite(cachedScrim)) backgroundScrim = Math.min(0.62, Math.max(0, cachedScrim));
				} catch {}
				root.style.setProperty('--patter_background_base', ambientColor);
				document.querySelector('meta[name="theme-color"]')?.setAttribute('content', ambientColor);
				root.style.setProperty('--patter_background_scrim', `${backgroundScrim}`);
				root.style.setProperty('--patter_focus', `${defaults.focus}px`);
				root.style.setProperty('--patter_tint', `${defaults.tint / 100}`);
                root.toggleAttribute('data-corner-controls', typeof saved.cornerControls === 'boolean' ? saved.cornerControls : true);
                root.style.setProperty('--patter_tint_color', saved.tintShade === 2 ? 'oklch(15.3% 0.025 135)' : saved.tintShade === 1 ? 'oklch(14.7% 0.004 49.3)' : 'oklch(12.9% 0.042 264.695)');
				root.style.setProperty('--patter_grain', `${defaults.grain / 100}`);
				root.style.setProperty('--patter_body_text_size', `${defaults.textSize}px`);
                const editorFonts = ['var(--patter_font_body)', 'Consolas, "Cascadia Mono", "Liberation Mono", monospace', 'var(--patter_font_ui)', '"Dyslexic", sans-serif'];
                root.style.setProperty('--patter_editor_font', editorFonts[Number.isInteger(saved.editorFont) && saved.editorFont >= 0 && saved.editorFont < editorFonts.length ? saved.editorFont : 0]);
				root.style.setProperty('--patter_background_position', backgroundPosition);
				root.style.setProperty('--patter_background', `url("${fallbackBackground}")`);
				if (fallbackBackground.startsWith('/backgrounds/')) {
					const wallpaperPreload = document.createElement('link');
					wallpaperPreload.rel = 'preload';
					wallpaperPreload.as = 'image';
					wallpaperPreload.href = fallbackBackground;
					wallpaperPreload.fetchPriority = 'high';
					document.head.append(wallpaperPreload);
				}
			})();
		</script>
<link rel="preload" href="/fonts/amarante_regular.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/fonts/bitter_regular.woff2" as="font" type="font/woff2" crossorigin>
		<link rel="preload" href="/fonts/google_sans.woff2" as="font" type="font/woff2" crossorigin>


		%sveltekit.head%

		<title>Patter</title>
	</head>

	<body data-sveltekit-preload-data="hover" class="overflow-hidden">
		<noscript>
			<div class="patter_noscript_notice">
				Patter needs JavaScript for navigation and autosaving. Enable JavaScript before writing, or copy your draft manually before leaving.
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>

</html>
